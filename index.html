
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101010">
<title>Shorts App</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#101010;color:#fff;font-family:Arial,sans-serif}
button{font:inherit;cursor:pointer}
#loading{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;background:#101010}
.loading-box{width:100%;max-width:360px;padding:25px;background:#1d1d1d;border:1px solid #333;border-radius:18px;text-align:center}
.loading-box h2{margin-bottom:12px}
.loading-box p{color:#aaa;font-size:14px;line-height:1.8}
.primary-btn{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:#f00;color:#fff;font-weight:bold}
#status{margin-top:12px;color:#ffaaaa;font-size:12px;line-height:1.7;overflow-wrap:anywhere}
#home{position:fixed;inset:0;display:none;flex-direction:column}
header{height:58px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#171717;border-bottom:1px solid #292929;font-weight:bold}
header button{border:0;background:none;color:#ff4545;font-size:13px}
#grid{flex:1;overflow-y:auto;padding:15px 13px 85px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-content:start;gap:13px}
.card{height:190px;position:relative;display:flex;align-items:flex-end;padding:13px;border:1px solid #333;border-radius:14px;background:linear-gradient(145deg,#292929,#111);overflow:hidden}
.card:before{content:"▶";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#ffffff25;font-size:50px}
.card span{position:relative;z-index:1;font-size:13px;overflow-wrap:anywhere}
#feed{position:fixed;inset:0;z-index:10;display:none;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior-y:contain;background:#000;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#feed::-webkit-scrollbar{display:none}
.item{height:100%;min-height:100%;width:100%;position:relative;display:flex;align-items:center;justify-content:center;scroll-snap-align:start;scroll-snap-stop:always;background:#000}
.item video{width:100%;height:100%;object-fit:contain;background:#000}
.back{position:fixed;top:max(15px,env(safe-area-inset-top));right:14px;z-index:15;padding:10px 15px;border:1px solid #ffffff55;border-radius:22px;background:#000b;color:#fff;font-size:13px}
.video-info{position:absolute;left:15px;right:15px;bottom:28px;z-index:3;padding:35px 10px 8px;background:linear-gradient(transparent,#0009);pointer-events:none}
.video-info span{font-size:14px;font-weight:bold;overflow-wrap:anywhere}
.error{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;padding:24px;background:#000e;text-align:center;line-height:1.8;overflow-wrap:anywhere}
.error small{display:block;margin-top:12px;color:#ffb1b1;font-size:11px;direction:ltr;overflow-wrap:anywhere}
#nav{position:fixed;inset:auto 0 0;z-index:8;height:62px;padding-bottom:env(safe-area-inset-bottom);display:none;justify-content:space-around;align-items:center;background:#171717;border-top:1px solid #292929}
#nav button{flex:1;height:100%;border:0;background:none;color:#aaa;font-size:12px}
#nav button.active{color:#f44}
#empty{grid-column:1/-1;padding:35px 10px;text-align:center;color:#aaa;line-height:1.8}
</style>
</head>

<body>

<section id="loading">
  <div class="loading-box">
    <h2>Shorts App</h2>
    <p>اختر مجلد الفيديوهات لعرض المقاطع وتشغيلها عمودياً.</p>
    <button class="primary-btn" onclick="selectFolder()">اختيار مجلد الفيديوهات</button>
    <div id="status"></div>
  </div>
</section>

<main id="home">
  <header>
    <span>مقاطع الفيديو</span>
    <button onclick="selectFolder()">تغيير المجلد</button>
  </header>
  <section id="grid"></section>
</main>

<main id="feed"></main>

<nav id="nav">
  <button class="active" onclick="goHome()">الرئيسية</button>
  <button onclick="shuffleVideos()">عشوائي</button>
  <button onclick="reloadFolder()">تحديث</button>
</nav>

<script>
'use strict';

let videosList=[];
let observer=null;
let activeIndex=-1;

const $=id=>document.getElementById(id);

document.addEventListener('DOMContentLoaded',()=>{
  setTimeout(()=>{
    if(window.AndroidBridge){
      window.AndroidBridge.checkSavedFolder();
    }
  },500);
});

function setStatus(message){
  $('status').textContent=message||'';
}

function selectFolder(){
  if(!window.AndroidBridge){
    setStatus('يجب تشغيل التطبيق على أندرويد.');
    return;
  }

  setStatus('جارٍ فتح اختيار المجلد...');
  window.AndroidBridge.selectFolder();
}

function reloadFolder(){
  if(window.AndroidBridge){
    setStatus('جارٍ تحديث الفيديوهات...');
    window.AndroidBridge.checkSavedFolder();
  }
}

function safeVideoUrl(path){
  if(!path)return '';

  let uri=String(path);

  if(!uri.startsWith('file://')){
    uri='file://'+(uri.startsWith('/')?'':'/')+uri;
  }

  if(!window.Capacitor ||
     typeof window.Capacitor.convertFileSrc!=='function'){
    throw new Error('Capacitor.convertFileSrc غير متاح');
  }

  return window.Capacitor.convertFileSrc(uri);
}

window.onFolderSelected=function(list){
  if(!Array.isArray(list)||!list.length){
    setStatus('لم يتم العثور على فيديوهات.');
    return;
  }

  videosList=list;
  setStatus('');

  $('loading').style.display='none';
  $('home').style.display='flex';
  $('feed').style.display='none';
  $('nav').style.display='flex';

  renderGrid();
};

window.onFolderError=function(message){
  setStatus(message||'حدث خطأ أثناء قراءة المجلد.');
};

function renderGrid(){
  const grid=$('grid');
  grid.replaceChildren();

  if(!videosList.length){
    const empty=document.createElement('div');
    empty.id='empty';
    empty.textContent='لا توجد فيديوهات في هذا المجلد.';
    grid.append(empty);
    return;
  }

  videosList.forEach((item,index)=>{
    const card=document.createElement('button');
    card.className='card';
    card.type='button';

    const label=document.createElement('span');
    label.textContent=item.name||'فيديو '+(index+1);

    card.append(label);
    card.onclick=()=>openFeed(index);
    grid.append(card);
  });
}

function createItem(item,index){
  const section=document.createElement('section');
  section.className='item';
  section.dataset.index=String(index);

  const video=document.createElement('video');
  video.playsInline=true;
  video.setAttribute('playsinline','');
  video.preload='none';
  video.muted=true;
  video.controls=false;
  video.dataset.path=item.path;
  video.dataset.loaded='false';

  video.onclick=()=>{
    if(video.paused){
      video.play().catch(e=>showError(section,e));
    }else{
      video.pause();
    }
  };

  const error=document.createElement('div');
  error.className='error';

  video.addEventListener('error',()=>{
    const code=video.error?video.error.code:0;
    const message=video.error?video.error.message:'غير معروف';
    const url=video.currentSrc||'غير متوفر';

    error.replaceChildren();

    const title=document.createElement('div');
    title.textContent=
      'تعذر تشغيل الفيديو. رمز الخطأ: '+code;

    const details=document.createElement('small');
    details.textContent=
      'الرسالة: '+message+
      '\nالمصدر: '+url+
      '\nالحجم: '+(item.size||'غير معروف');

    error.append(title,details);
    error.style.display='flex';

    console.error('Video playback error',{
      name:item.name,
      path:item.path,
      url:url,
      code:code,
      message:message,
      networkState:video.networkState,
      readyState:video.readyState
    });
  });

  video.addEventListener('loadeddata',()=>{
    error.style.display='none';
  });

  const info=document.createElement('div');
  info.className='video-info';

  const name=document.createElement('span');
  name.textContent=item.name||'فيديو';

  info.append(name);
  section.append(video,error,info);

  return section;
}

function showError(section,error){
  const box=section.querySelector('.error');
  box.textContent='تعذر تشغيل الفيديو: '+error.message;
  box.style.display='flex';
}

function openFeed(index){
  const feed=$('feed');

  if(observer){
    observer.disconnect();
    observer=null;
  }

  feed.replaceChildren();

  const back=document.createElement('button');
  back.className='back';
  back.textContent='الرئيسية ✕';
  back.onclick=goHome;
  feed.append(back);

  videosList.forEach((item,i)=>{
    feed.append(createItem(item,i));
  });

  $('home').style.display='none';
  $('nav').style.display='none';
  feed.style.display='block';

  observer=new IntersectionObserver(entries=>{
    const visible=entries
      .filter(e=>e.isIntersecting)
      .sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];

    if(visible&&visible.intersectionRatio>=0.55){
      activateVideo(Number(visible.target.dataset.index));
    }
  },{
    root:feed,
    threshold:[0.3,0.55,0.8]
  });

  feed.querySelectorAll('.item').forEach(item=>{
    observer.observe(item);
  });

  requestAnimationFrame(()=>{
    const target=feed.querySelector('[data-index="'+index+'"]');
    if(target){
      feed.scrollTop=target.offsetTop;
      activateVideo(index);
    }
  });
}

function activateVideo(index){
  if(index<0||index>=videosList.length)return;

  activeIndex=index;

  document.querySelectorAll('.item').forEach((section,i)=>{
    const video=section.querySelector('video');

    if(i===index){
      loadVideo(video);

      video.play().catch(error=>{
        console.log('Playback requires user interaction:',error);
      });

    }else{
      video.pause();

      // نحتفظ بالفيديو المجاور فقط لتخفيف تحميل الملفات
      if(Math.abs(i-index)>1){
        video.removeAttribute('src');
        video.dataset.loaded='false';
        video.load();
      }
    }

    if(Math.abs(i-index)===1){
      loadVideo(video);
    }
  });
}

function loadVideo(video){
  if(video.dataset.loaded==='true')return;

  try{
    const url=safeVideoUrl(video.dataset.path);

    if(!url){
      throw new Error('مسار الفيديو غير صالح');
    }

    video.src=url;
    video.dataset.loaded='true';
    video.preload='auto';
    video.load();

  }catch(error){
    const section=video.closest('.item');
    showError(section,error);
  }
}

function goHome(){
  if(observer){
    observer.disconnect();
    observer=null;
  }

  document.querySelectorAll('#feed video').forEach(video=>{
    video.pause();
  });

  activeIndex=-1;

  $('feed').style.display='none';
  $('home').style.display='flex';
  $('nav').style.display='flex';
}

function shuffleVideos(){
  videosList=[...videosList].sort(()=>Math.random()-0.5);
  renderGrid();
}

window.handleAndroidBack=function(){
  if($('feed').style.display==='block'){
    goHome();
    return true;
  }
  return false;
};
</script>

</body>
</html>
