<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b12">
<title>Shorts</title>

<style>
:root {
  color-scheme: dark;
  --bg: #090b12;
  --muted: #8f9aaf;
  --accent: #8b7cff;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: #f7f8fc;
  font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
}

button {
  font: inherit;
  cursor: pointer;
}

#loading {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: radial-gradient(ellipse at 50% 20%, #24214a, #101522 48%, #090b12);
}

.loading-box {
  width: 100%;
  max-width: 390px;
  padding: 30px 24px;
  background: #151b2a;
  border: 1px solid #303951;
  border-radius: 28px;
  text-align: center;
  box-shadow: 0 24px 80px #0008;
}

.logo {
  width: 66px;
  height: 66px;
  margin: 0 auto 18px;
  border-radius: 22px;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg, #8b7cff, #5146bd);
  font-size: 28px;
}

.loading-box h1 {
  font-size: 25px;
  margin-bottom: 8px;
}

.loading-box p {
  color: #aab3c5;
  font-size: 14px;
  line-height: 1.9;
}

.primary-btn {
  width: 100%;
  margin-top: 22px;
  padding: 15px;
  border: 0;
  border-radius: 16px;
  background: linear-gradient(110deg, #8b7cff, #5d55d9);
  color: #fff;
  font-weight: 800;
}

#status {
  margin-top: 13px;
  color: #ffc2b9;
  font-size: 12px;
  line-height: 1.7;
  overflow-wrap: anywhere;
}

#home {
  position: fixed;
  inset: 0;
  display: none;
  flex-direction: column;
  background: linear-gradient(180deg, #101626, #090b12 48%);
}

header {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: calc(15px + env(safe-area-inset-top)) 18px 14px;
  border-bottom: 1px solid #ffffff0d;
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
}

.brand-mark {
  width: 38px;
  height: 38px;
  border-radius: 13px;
  background: linear-gradient(135deg, #8b7cff, #5146bd);
  display: grid;
  place-items: center;
}

.brand strong {
  font-size: 18px;
  display: block;
}

.brand small {
  display: block;
  color: var(--muted);
  font-size: 11px;
  margin-top: 2px;
}

.header-actions {
  display: flex;
  gap: 8px;
}

.icon-btn {
  border: 1px solid #ffffff18;
  background: #ffffff0a;
  color: #dfe4f1;
  border-radius: 13px;
  padding: 10px 12px;
  font-size: 12px;
}

.content {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 16px 14px calc(102px + env(safe-area-inset-bottom));
}

.section-heading {
  display: flex;
  justify-content: space-between;
  align-items: end;
  margin: 3px 2px 14px;
}

.section-heading h2 {
  font-size: 19px;
}

.section-heading span {
  font-size: 11px;
  color: var(--muted);
}

#progressBox {
  display: none;
  margin: 0 0 14px;
  padding: 13px 14px;
  border: 1px solid #8b7cff35;
  background: #8b7cff12;
  border-radius: 15px;
}

#progressText {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  color: #d8d3ff;
  font-size: 12px;
  margin-bottom: 9px;
}

#progressTrack {
  height: 6px;
  background: #ffffff18;
  border-radius: 9px;
  overflow: hidden;
}

#progressBar {
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, #8b7cff, #b7adff);
  border-radius: 9px;
  transition: width .18s ease;
}

#grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 13px;
  align-content: start;
}

.card {
  height: clamp(170px, 28vh, 235px);
  position: relative;
  display: block;
  width: 100%;
  padding: 0;
  border: 1px solid #ffffff16;
  border-radius: 19px;
  background: linear-gradient(135deg, #292e49, #131927);
  overflow: hidden;
  color: #fff;
  isolation: isolate;
  box-shadow: 0 8px 25px #0003;
}

.card img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -2;
  background: linear-gradient(135deg, #292e49, #131927);
}

.card:after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background: linear-gradient(180deg, #0000 35%, #0009);
}

.card .play {
  position: absolute;
  top: 12px;
  left: 12px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: #080b16a8;
  border: 1px solid #ffffff55;
}

.card .index {
  position: absolute;
  top: 12px;
  right: 12px;
  padding: 5px 8px;
  border-radius: 9px;
  background: #090b1299;
  color: #dce0f0;
  font-size: 10px;
}

.card .placeholder {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: #ffffff35;
  font-size: 38px;
}

#empty {
  grid-column: 1 / -1;
  padding: 38px 18px;
  text-align: center;
  color: #aab3c5;
  line-height: 2;
  background: #ffffff08;
  border: 1px dashed #ffffff25;
  border-radius: 20px;
}

#nav {
  position: fixed;
  inset: auto 12px calc(10px + env(safe-area-inset-bottom));
  z-index: 8;
  height: 62px;
  display: none;
  justify-content: space-around;
  align-items: center;
  background: #171d2bef;
  border: 1px solid #ffffff1a;
  border-radius: 21px;
  box-shadow: 0 12px 38px #0008;
  backdrop-filter: blur(18px);
}

#nav button {
  flex: 1;
  height: 100%;
  border: 0;
  background: none;
  color: #929db2;
  font-size: 12px;
  font-weight: 650;
}

#nav button.active {
  color: #b7adff;
}

#feed {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: none;
  background: #000;
}

@media (min-width: 700px) {
  #grid {
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 16px;
  }

  .content {
    padding-left: 22px;
    padding-right: 22px;
  }

  .card {
    height: 230px;
  }
}
</style>
</head>

<body>

<section id="loading">
  <div class="loading-box">
    <div class="logo">▶</div>
    <h1>Shorts</h1>
    <p>
      مكتبتك الخاصة لمقاطع الفيديو.<br>
      اختر المجلد مرة واحدة وسيتم تذكره تلقائياً.
    </p>
    <button class="primary-btn" onclick="selectFolder()">
      اختيار مجلد الفيديوهات
    </button>
    <div id="status"></div>
  </div>
</section>

<main id="home">
  <header>
    <div class="brand">
      <div class="brand-mark">▶</div>
      <div>
        <strong>مكتبتي</strong>
        <small>مقاطع الفيديو الخاصة بك</small>
      </div>
    </div>

    <div class="header-actions">
      <button class="icon-btn" onclick="reloadFolder()">↻ تحديث</button>
      <button class="icon-btn" onclick="selectFolder()">المجلد</button>
    </div>
  </header>

  <div class="content">
    <div class="section-heading">
      <h2>الفيديوهات</h2>
      <span id="count">0 مقطع</span>
    </div>

    <section id="progressBox">
      <div id="progressText">
        <span id="progressLabel">جارٍ تجهيز المكتبة...</span>
        <span id="progressCount">0 / 0</span>
      </div>
      <div id="progressTrack">
        <div id="progressBar"></div>
      </div>
    </section>

    <section id="grid"></section>
  </div>
</main>

<main id="feed"></main>

<nav id="nav">
  <button class="active" onclick="goHome()">⌂<br>الرئيسية</button>
  <button onclick="shuffleVideos()">⤨<br>عشوائي</button>
  <button onclick="reloadFolder()">↻<br>تحديث</button>
</nav>

<script>
'use strict';

let videosList = [];
let importTotal = 0;

const $ = id => document.getElementById(id);

document.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    if (window.AndroidBridge) {
      window.AndroidBridge.checkSavedFolder();
    } else {
      setStatus('يجب تشغيل التطبيق على أندرويد.');
    }
  }, 250);
});

function setStatus(s) {
  $('status').textContent = s || '';
}

function showHome() {
  $('loading').style.display = 'none';
  $('home').style.display = 'flex';
  $('nav').style.display = 'flex';
  $('feed').style.display = 'none';
}

function selectFolder() {
  if (!window.AndroidBridge) {
    setStatus('يجب تشغيل التطبيق على أندرويد.');
    return;
  }

  setStatus('جارٍ فتح اختيار المجلد...');
  window.AndroidBridge.selectFolder();
}

function reloadFolder() {
  if (window.AndroidBridge) {
    beginProgress(-1, 'جارٍ فحص المجلد المحفوظ...');
    window.AndroidBridge.checkSavedFolder();
  }
}

function fileUrl(path) {
  if (
    !path ||
    !window.Capacitor ||
    typeof window.Capacitor.convertFileSrc !== 'function'
  ) return '';

  return window.Capacitor.convertFileSrc(
    'file://' + String(path).replace(/^file:\/\//, '')
  );
}

function beginProgress(total, label) {
  showHome();

  importTotal = total;
  $('progressBox').style.display = 'block';
  $('progressLabel').textContent = label || 'جارٍ استيراد الفيديوهات...';
  $('progressCount').textContent = total > 0 ? '0 / ' + total : '...';
  $('progressBar').style.width = '0%';
}

function updateProgress(done, total) {
  if (total >= 0) {
    importTotal = total;

    $('progressCount').textContent = done + ' / ' + total;
    $('progressBar').style.width =
      (total ? Math.min(100, done / total * 100) : 100) + '%';

    $('progressLabel').textContent =
      done < total
        ? 'جارٍ تجهيز الفيديوهات والصور المصغرة...'
        : 'اكتمل الاستيراد';
  }
}

function cardFor(item, index) {
  let card = document.createElement('button');

  card.className = 'card';
  card.type = 'button';
  card.dataset.id = item.id || item.uri || '';

  let placeholder = document.createElement('span');
  placeholder.className = 'placeholder';
  placeholder.textContent = '▶';
  card.append(placeholder);

  if (item.thumbnail) {
    setCardThumbnail(card, item.thumbnail);
  }

  let badge = document.createElement('span');
  badge.className = 'index';
  badge.textContent = String(index + 1);

  let play = document.createElement('span');
  play.className = 'play';
  play.textContent = '▶';

  card.append(badge, play);
  card.onclick = () => openFeed(index);

  return card;
}

function setCardThumbnail(card, path) {
  let img = card.querySelector('img');

  if (!img) {
    img = document.createElement('img');
    img.loading = 'lazy';
    img.alt = '';
    card.insertBefore(img, card.firstChild);
  }

  img.src = fileUrl(path);

  img.onload = () => {
    let placeholder = card.querySelector('.placeholder');
    if (placeholder) placeholder.remove();
  };

  img.onerror = () => img.remove();
}

function renderGrid() {
  let grid = $('grid');
  grid.replaceChildren();

  $('count').textContent = videosList.length + ' مقطع';

  if (!videosList.length) {
    let empty = document.createElement('div');
    empty.id = 'empty';
    empty.textContent = 'لم يتم العثور على فيديوهات في هذا المجلد.';
    grid.append(empty);
    return;
  }

  videosList.forEach((item, index) => {
    grid.append(cardFor(item, index));
  });
}

function upsertVideo(item) {
  let key = item.id || item.uri;

  let index = videosList.findIndex(
    video => (video.id || video.uri) === key
  );

  if (index < 0) {
    videosList.push(item);

    let card = cardFor(item, videosList.length - 1);
    $('grid').append(card);

  } else {
    videosList[index] = {
      ...videosList[index],
      ...item
    };

    let card = [...$('grid').children].find(
      element => element.dataset.id === key
    );

    if (card && item.thumbnail) {
      setCardThumbnail(card, item.thumbnail);
    }
  }

  $('count').textContent = videosList.length + ' مقطع';
}

window.onCachedVideos = function(list) {
  if (Array.isArray(list) && list.length) {
    videosList = list;
    showHome();
    renderGrid();
  }
};

window.onImportStarted = function(total) {
  beginProgress(
    total,
    total < 0
      ? 'جارٍ قراءة محتويات المجلد...'
      : 'جارٍ استيراد ' + total + ' فيديو...'
  );

  if (videosList.length) renderGrid();
};

window.onImportTotal = function(total) {
  importTotal = total;

  $('progressLabel').textContent = total
    ? 'تم العثور على ' + total + ' فيديو. جارٍ تجهيزها...'
    : 'لا توجد فيديوهات في المجلد.';

  updateProgress(0, total);

  if (!total) renderGrid();
};

window.onVideoImported = function(item, done, total) {
  if (item && typeof item === 'object') {
    upsertVideo(item);
  }

  updateProgress(done, total);
};

window.onVideoThumbnailReady = function(id, path) {
  let index = videosList.findIndex(
    video => (video.id || video.uri) === id
  );

  if (index >= 0) {
    videosList[index].thumbnail = path;

    let card = [...$('grid').children].find(
      element => element.dataset.id === id
    );

    if (card) setCardThumbnail(card, path);
  }
};

window.onImportProgress = function(done, total) {
  updateProgress(done, total);
};

window.onImportFinished = function(total, failed) {
  updateProgress(total, total);

  $('progressLabel').textContent = failed
    ? 'اكتمل الفهرس مع تعذر تجهيز ' + failed + ' صورة مصغرة.'
    : 'اكتمل الاستيراد بنجاح';
};

window.onFolderError = function(message) {
  showHome();

  setStatus(message || 'حدث خطأ أثناء قراءة المجلد.');

  $('progressLabel').textContent =
    message || 'تعذر قراءة المجلد';
};

function openFeed(index) {
  if (!window.AndroidBridge || !videosList.length) return;

  $('home').style.display = 'none';
  $('nav').style.display = 'none';
  $('feed').style.display = 'block';

  window.AndroidBridge.openPlayer(
    JSON.stringify(videosList),
    index
  );
}

function returnFromNativePlayer() {
  goHome();
}

window.returnFromNativePlayer = returnFromNativePlayer;

function goHome() {
  $('feed').style.display = 'none';
  $('home').style.display = 'flex';
  $('nav').style.display = 'flex';
}

function shuffleVideos() {
  for (let i = videosList.length - 1; i > 0; i--) {
    let j = Math.floor(Math.random() * (i + 1));

    [videosList[i], videosList[j]] =
      [videosList[j], videosList[i]];
  }

  renderGrid();
}

window.handleAndroidBack = function() {
  if ($('feed').style.display === 'block') {
    goHome();
    return true;
  }

  return false;
};
</script>

</body>
</html>
