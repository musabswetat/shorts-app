name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Project & Capacitor
        run: |
          mkdir -p public
          if [ -f index.html ]; then
            cp index.html public/index.html
          fi

          if [ ! -f package.json ]; then
            npm init -y
          fi

          npm install @capacitor/core@^6 @capacitor/android@^6
          npm install --save-dev @capacitor/cli@^6

          if [ ! -f capacitor.config.json ]; then
            printf '{\n  "appId": "com.shorts.app.v2",\n  "appName": "Shorts App",\n  "webDir": "public"\n}' > capacitor.config.json
          fi

          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Inject Correct MainActivity & Manifest via Python
        run: |
          python3 - << 'EOF'
          import os

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r", encoding="utf-8") as f:
                  content = f.read()
              
              perms = """
                  <uses-permission android:name="android.permission.INTERNET" />
                  <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
                  <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              """
              if "READ_MEDIA_VIDEO" not in content:
                  content = content.replace("<uses-permission android:name=\"android.permission.INTERNET\" />", perms)
                  with open(manifest_path, "w", encoding="utf-8") as f:
                      f.write(content)

          gradle_path = "android/app/build.gradle"
          if os.path.exists(gradle_path):
              with open(gradle_path, "r", encoding="utf-8") as f:
                  g_content = f.read()
              if "androidx.documentfile" not in g_content:
                  g_content = g_content.replace("dependencies {", "dependencies {\n    implementation \"androidx.documentfile:documentfile:1.0.0\"")
                  with open(gradle_path, "w", encoding="utf-8") as f:
                      f.write(g_content)

          java_dir = "android/app/src/main/java/com/shorts/app/v2"
          os.makedirs(java_dir, exist_ok=True)
          java_path = os.path.join(java_dir, "MainActivity.java")

          java_code = """package com.shorts.app.v2;

          import android.Manifest;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import androidx.activity.result.ActivityResultLauncher;
          import androidx.activity.result.contract.ActivityResultContracts;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import androidx.documentfile.provider.DocumentFile;
          import com.getcapacitor.BridgeActivity;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;

          public class MainActivity extends BridgeActivity {
              private ActivityResultLauncher<Intent> folderPickerLauncher;
              private static final String PREFS_NAME = "ShortsPrefs";
              private static final String KEY_FOLDER_URI = "savedFolderUri";

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WebView webView = bridge.getWebView();
                  WebSettings settings = webView.getSettings();
                  settings.setAllowFileAccess(true);
                  settings.setAllowFileAccessFromFileURLs(true);
                  settings.setAllowUniversalAccessFromFileURLs(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_MEDIA_VIDEO) != PackageManager.PERMISSION_GRANTED &&
                      ContextCompat.checkSelfPermission(this, Manifest.permission.READ_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, new String[]{
                          Manifest.permission.READ_MEDIA_VIDEO,
                          Manifest.permission.READ_EXTERNAL_STORAGE
                      }, 101);
                  }

                  folderPickerLauncher = registerForActivityResult(
                      new ActivityResultContracts.StartActivityForResult(),
                      result -> {
                          if (result.getResultCode() == RESULT_OK && result.getData() != null) {
                              Uri treeUri = result.getData().getData();
                              if (treeUri != null) {
                                  getContentResolver().takePersistableUriPermission(treeUri,
                                      Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION);
                                  
                                  SharedPreferences prefs = getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
                                  prefs.edit().putString(KEY_FOLDER_URI, treeUri.toString()).apply();

                                  processVideosInBackground(treeUri);
                              }
                          }
                      }
                  );

                  bridge.getWebView().addJavascriptInterface(new WebAppInterface(this), "AndroidBridge");
              }

              public void openFolderPicker() {
                  Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT_TREE);
                  folderPickerLauncher.launch(intent);
              }

              private void processVideosInBackground(Uri treeUri) {
                  new Thread(() -> {
                      String jsonVideos = getVideosFromTreeUri(treeUri);
                      runOnUiThread(() -> {
                          bridge.getWebView().evaluateJavascript("javascript:onFolderSelected(" + jsonVideos + ")", null);
                      });
                  }).start();
              }

              private String getVideosFromTreeUri(Uri treeUri) {
                  JSONArray jsonArray = new JSONArray();
                  try {
                      DocumentFile pickedDir = DocumentFile.fromTreeUri(this, treeUri);
                      if (pickedDir != null && pickedDir.isDirectory()) {
                          File cacheDir = new File(getCacheDir(), "video_cache");
                          if (!cacheDir.exists()) cacheDir.mkdirs();

                          for (DocumentFile file : pickedDir.listFiles()) {
                              if (file.isFile() && file.getName() != null) {
                                  String name = file.getName().toLowerCase();
                                  if (name.endsWith(".mp4") || name.endsWith(".mkv") || name.endsWith(".webm") || name.endsWith(".mov")) {
                                      File cachedFile = new File(cacheDir, file.getName());
                                      if (!cachedFile.exists() || cachedFile.length() == 0) {
                                          try (InputStream in = getContentResolver().openInputStream(file.getUri());
                                               FileOutputStream out = new FileOutputStream(cachedFile)) {
                                              byte[] buffer = new byte[16384];
                                              int read;
                                              while ((read = in.read(buffer)) != -1) {
                                                  out.write(buffer, 0, read);
                                              }
                                          } catch (Exception e) {
                                              continue;
                                          }
                                      }

                                      JSONObject obj = new JSONObject();
                                      obj.put("name", file.getName());
                                      // إرسال المسار المطلق الحقيقي ليتم تحويله بكاباسيتور عبر convertFileSrc
                                      obj.put("path", cachedFile.getAbsolutePath());
                                      jsonArray.put(obj);
                                  }
                              }
                          }
                      }
                  } catch (Exception e) {
                  }
                  return jsonArray.toString();
              }

              public class WebAppInterface {
                  MainActivity mContext;
                  WebAppInterface(MainActivity c) { mContext = c; }

                  @JavascriptInterface
                  public void selectFolder() {
                      mContext.runOnUiThread(() -> mContext.openFolderPtr = () -> mContext.openFolderPicker());
                      mContext.runOnUiThread(() -> mContext.openFolderPicker());
                  }

                  @JavascriptInterface
                  public void checkSavedFolder() {
                      SharedPreferences prefs = mContext.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
                      String savedUriStr = prefs.getString(KEY_FOLDER_URI, null);
                      if (savedUriStr != null) {
                          try {
                              Uri savedUri = Uri.parse(savedUriStr);
                              mContext.getContentResolver().takePersistableUriPermission(savedUri,
                                  Intent.FLAG_GRANT_READ_URI_PERMISSION);
                              mContext.processVideosInBackground(savedUri);
                          } catch (Exception e) {
                          }
                      }
                  }
              }
          }
          """

          with open(java_path, "w", encoding="utf-8") as f:
              f.write(java_code)
          print("MainActivity.java successfully injected.")
          EOF

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-android-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
