name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Setup Project Structure & Capacitor
      run: |
        mkdir -p public
        if [ -f "index.html" ]; then
          mv index.html public/
        fi

        # إنشاء ملف package.json تلقائياً
        cat << 'EOF' > package.json
        {
          "name": "shorts-app",
          "version": "1.0.0",
          "private": true,
          "dependencies": {
            "@capacitor/core": "^6.0.0",
            "@capacitor/android": "^6.0.0"
          },
          "devDependencies": {
            "@capacitor/cli": "^6.0.0"
          }
        }
        EOF

        # إنشاء ملف إعدادات كاباسيتور
        cat << 'EOF' > capacitor.config.json
        {
          "appId": "com.shorts.app",
          "appName": "YouTube Shorts",
          "webDir": "public"
        }
        EOF

        npm install
        npx cap add android
        npx cap sync android

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: my-android-app
        path: android/app/build/outputs/apk/debug/app-debug.apk
