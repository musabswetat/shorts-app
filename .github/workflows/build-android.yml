name: Build Shorts Android APK

on:
  push:
    branches: [main, master]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f index.html
          test -f native/MainActivity.java
          test -f native/PlayerActivity.java

          mkdir -p public
          cp index.html public/index.html

          if [ ! -f package.json ]; then
            npm init -y
          fi

          npm install @capacitor/core@^6 @capacitor/android@^6
          npm install --save-dev @capacitor/cli@^6

          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.shorts.app.v2",
            "appName": "Shorts App",
            "webDir": "public"
          }
          JSON

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Install native player and persistent library code
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path('android/app/build.gradle')
          src = gradle.read_text(encoding='utf-8')

          deps = [
            'implementation "androidx.documentfile:documentfile:1.0.1"',
            'implementation "androidx.media3:media3-exoplayer:1.5.1"',
            'implementation "androidx.media3:media3-ui:1.5.1"'
          ]

          for dep in deps:
            artifact = dep.split(':')[1]

            if artifact not in src:
              match = re.search(r'dependencies\s*\{', src)

              if not match:
                raise SystemExit(
                  'Could not find dependencies block in app/build.gradle'
                )

              pos = match.end()
              src = src[:pos] + '\n    ' + dep + src[pos:]

          gradle.write_text(src, encoding='utf-8')

          java_dir = Path(
            'android/app/src/main/java/com/shorts/app/v2'
          )

          java_dir.mkdir(parents=True, exist_ok=True)

          for name in ('MainActivity.java', 'PlayerActivity.java'):
            (java_dir / name).write_text(
              Path('native', name).read_text(encoding='utf-8'),
              encoding='utf-8'
            )

          manifest = Path(
            'android/app/src/main/AndroidManifest.xml'
          )

          xml = manifest.read_text(encoding='utf-8')

          activity = (
            '<activity '
            'android:name="com.shorts.app.v2.PlayerActivity" '
            'android:exported="false" '
            'android:screenOrientation="unspecified" '
            'android:theme="@android:style/Theme.Material.NoActionBar" />'
          )

          if 'com.shorts.app.v2.PlayerActivity' not in xml:
            xml = xml.replace(
              '</application>',
              '        ' + activity + '\n    </application>'
            )

          manifest.write_text(xml, encoding='utf-8')
          PY

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shorts-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
