
name: Build Shorts Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check project files
        run: |
          test -f index.html
          test -f native/MainActivity.java

      - name: Prepare web assets
        run: |
          mkdir -p public
          cp index.html public/index.html

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.shorts.app.v2",
            "appName": "Shorts App",
            "webDir": "public",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

      - name: Add Android platform
        run: |
          npx cap add android

      - name: Install native MainActivity
        run: |
          mkdir -p android/app/src/main/java/com/shorts/app/v2
          cp native/MainActivity.java android/app/src/main/java/com/shorts/app/v2/MainActivity.java

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shorts-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
