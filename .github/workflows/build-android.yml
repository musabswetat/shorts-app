
name: Build Shorts Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install project dependencies
        run: |
          npm install
          npm install @capacitor/core@6 @capacitor/android@6 @capacitor/cli@6

      - name: Prepare Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Update Android build versions
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path("android")

          # Update Android Gradle Plugin
          gradle_file = root / "build.gradle"
          if gradle_file.exists():
              content = gradle_file.read_text()
              content = content.replace("8.2.1", "8.6.1")
              gradle_file.write_text(content)

          # Update Gradle wrapper
          wrapper = root / "gradle/wrapper/gradle-wrapper.properties"
          if wrapper.exists():
              content = wrapper.read_text()
              content = content.replace(
                  "gradle-8.2.1-all.zip",
                  "gradle-8.7-all.zip"
              )
              content = content.replace(
                  "gradle-8.2.1-bin.zip",
                  "gradle-8.7-bin.zip"
              )
              wrapper.write_text(content)

          # Update compile SDK to 35
          files = [
              root / "variables.gradle",
              root / "app/build.gradle"
          ]

          for file in files:
              if not file.exists():
                  continue

              content = file.read_text()
              content = re.sub(
                  r"(compileSdkVersion\s*[= ]\s*)34\b",
                  r"\g<1>35",
                  content
              )
              content = re.sub(
                  r"(compileSdk\s*[= ]\s*)34\b",
                  r"\g<1>35",
                  content
              )
              file.write_text(content)

          print("Android build versions updated.")
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Add Android dependencies
        run: |
          python3 <<'PY'
          from pathlib import Path

          file = Path("android/app/build.gradle")
          content = file.read_text()

          dependencies = [
              'implementation "androidx.documentfile:documentfile:1.0.1"',
              'implementation "androidx.media3:media3-exoplayer:1.5.1"',
              'implementation "androidx.media3:media3-ui:1.5.1"'
          ]

          for dependency in dependencies:
              if dependency not in content:
                  if "dependencies {" not in content:
                      raise SystemExit("dependencies block not found")
                  content = content.replace(
                      "dependencies {",
                      "dependencies {\n    " + dependency,
                      1
                  )

          file.write_text(content)
          PY

      - name: Install Shorts Android Java files
        run: |
          JAVA_DIR="android/app/src/main/java/com/shorts/app/v2"
          mkdir -p "$JAVA_DIR"

          cp native/MainActivity.java "$JAVA_DIR/MainActivity.java"
          cp native/PlayerActivity.java "$JAVA_DIR/PlayerActivity.java"

      - name: Register PlayerActivity
        run: |
          python3 <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()

          activity = '''
                  <activity
                      android:name="com.shorts.app.v2.PlayerActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="false"
                      android:screenOrientation="unspecified" />
          '''

          if "com.shorts.app.v2.PlayerActivity" not in content:
              content = content.replace(
                  "</application>",
                  activity + "\n    </application>"
              )

          manifest.write_text(content)
          PY

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shorts-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
